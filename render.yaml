# Render Blueprint - TEMPORARY STAGING server for frontend development.
# Contains only demo data. Do not put real buyers/employees here.
# Docs: https://render.com/docs/blueprint-spec (check current free-tier limits).
services:
  - type: web
    name: uzz-crm-api-staging
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: uzz-crm-db-staging
          property: connectionString
      # Secrets generated by Render (random, base64, 256 bit). Never reuse the
      # local/production keys here.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY_V1
        generateValue: true
      - key: BLIND_INDEX_KEY_V1
        generateValue: true
      # Frontend on another origin (e.g. http://localhost:5173) -> cross-site cookies.
      - key: COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      - key: TRUST_PROXY
        value: "1"
      - key: SWAGGER_ENABLED
        value: "true"
      - key: BUSINESS_TIMEZONE
        value: Asia/Bishkek
      - key: WORKING_WEEKDAYS
        value: 1,2,3,4,5
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. http://localhost:5173,https://your-frontend.example
      - key: DEMO_SEED
        value: "true"
      - key: DEMO_SEED_PASSWORD
        sync: false # set in the dashboard; share with the frontend team privately
      # Optional: SMTP of a test mailbox (Mailtrap sandbox / Brevo) to read
      # confirmation codes for account creation.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "CRM Staging <no-reply@staging.invalid>"

databases:
  - name: uzz-crm-db-staging
    plan: free
    region: frankfurt
    databaseName: uzz_crm_staging
    user: uzz_staging
