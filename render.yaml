# Render Blueprint - CRM API with REAL users (owner decision 2026-09-18:
# free tier for now).
#
# FREE TIER LIMITS - read before entering real data:
# - the free PostgreSQL database EXPIRES (about 30 days) and has no backups:
#   the backup agent on the Director's computer is the only copy of the data;
# - uploaded files live on the container disk and are LOST on every restart
#   or deploy (only the latest backup keeps them);
# - outbound SMTP ports are blocked -> email goes through the Brevo HTTPS API.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: uzz-crm-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: staging # Swagger stays available for the frontend developer; set "production" to hide it.
      - key: DATABASE_URL
        fromDatabase:
          name: uzz-crm-db
          property: connectionString
      # Secrets generated by Render (random, 256 bit). After the first deploy
      # they also travel inside every (encrypted) backup - see docs/BACKUPS.md.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY_V1
        generateValue: true
      - key: BLIND_INDEX_KEY_V1
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      - key: TRUST_PROXY
        value: "1"
      - key: SWAGGER_ENABLED
        value: "true"
      - key: BUSINESS_TIMEZONE
        value: Asia/Bishkek
      - key: WORKING_WEEKDAYS
        value: 1,2,3,4,5
      - key: CORS_ALLOWED_ORIGINS
        sync: false # frontend origins, comma-separated, e.g. http://localhost:5173
      # First Director - used only while the database has no users. Remove
      # SEED_DIRECTOR_PASSWORD after the first successful login.
      - key: SEED_DIRECTOR_USERNAME
        sync: false
      - key: SEED_DIRECTOR_FULL_NAME
        sync: false
      - key: SEED_DIRECTOR_EMAIL
        sync: false # a real mailbox: every login needs the code sent here
      - key: SEED_DIRECTOR_PASSWORD
        sync: false # at least 12 characters
      # Email delivery (login and confirmation codes). Required.
      - key: EMAIL_TRANSPORT
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false # e.g. CRM Улуу Жибек Жолу <verified-sender@yourdomain>
      # Backups to the Director's computer (docs/BACKUPS.md).
      - key: BACKUP_PUBLIC_KEY
        sync: false # base64 value printed by "npm run backup:keygen"
      - key: BACKUP_AGENT_TOKEN_SHA256
        sync: false # printed by "npm run backup:agent-token"

  # Frontend (React SPA) - free static site. After the first deploy put its
  # https address into CORS_ALLOWED_ORIGINS of uzz-crm-api.
  - type: web
    name: uzz-crm-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false # https://<uzz-crm-api address>/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The sha256 is the inline theme script in frontend/index.html - update it if that script changes.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-JZ1WohQZVuVaNcSSO/3gmm8hsY5WS3BBNF3bgM6NwPA='; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' https://*.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache

databases:
  - name: uzz-crm-db
    plan: free
    region: frankfurt
    databaseName: uzz_crm
    user: uzz_crm
